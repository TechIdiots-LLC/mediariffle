name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet test MediaRiffle.slnx

  package:
    name: Package (${{ matrix.rid }})
    # Windows: NSIS for the installers; the Linux packages are made by a .NET tool, so they build here too
    runs-on: windows-latest
    needs: test
    strategy:
      fail-fast: false
      matrix:
        rid: [win-x64, win-arm64, linux-x64, linux-arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Install NSIS
        if: startsWith(matrix.rid, 'win-')
        shell: pwsh
        run: |
          if (-not (Get-Command makensis.exe -ErrorAction SilentlyContinue) -and -not (Test-Path 'C:\Program Files (x86)\NSIS\makensis.exe')) {
            choco install nsis -y --no-progress
          }
      - name: Package
        shell: pwsh
        run: |
          $version = ([regex]::Match((Get-Content src/MediaRiffle.Server/MediaRiffle.Server.csproj -Raw), '<Version>([^<]+)')).Groups[1].Value
          ./build/Package.ps1 -Rid ${{ matrix.rid }} -OutDir ci-files -Label "v$version-ci${{ github.run_number }}-$('${{ github.sha }}'.Substring(0, 7))"
      - uses: actions/upload-artifact@v4
        with:
          name: ci-${{ matrix.rid }}
          path: ci-files/
          retention-days: 7
