# MediaRiffle CI on the Windows shell runner (tag "windows"), as VistumblerMAUI's. GitLab ignores .github/.
# The runner needs the .NET 10 SDK, NSIS (makensis) and, for the version bump, Python 3.
#
#   test                  Merge requests and pushes to main: dotnet test.
#   ci-package            The same: every platform's packages as job artifacts (7 days), named
#                         v<version>-ci<pipeline>-<commit> so a download says what it is.
#   release-*             Push to main: if no GitLab release exists for <Version> (src/MediaRiffle.Server/
#                         MediaRiffle.Server.csproj), build build/Package.ps1's files for every platform and create the
#                         release with the CHANGELOG.md notes:
#                           MediaRiffle-v<ver>-win-x64-setup.exe, -win-arm64-setup.exe   Windows service installers
#                           MediaRiffle-v<ver>-win-x64.zip, -win-arm64.zip               portable / IIS
#                           mediariffle_<ver>-1_amd64.deb, _arm64.deb                    Ubuntu/Debian
#                           MediaRiffle-v<ver>-linux-x64.tar.gz, -linux-arm64.tar.gz     other distros (install.sh)
#   bump-version          Build > Pipelines > New pipeline with BUMP_VERSION set: bump the version, roll the changelog,
#                         push release-v<version> and open a merge request. Merging it makes the release.
#
# CI/CD variables (Settings > CI/CD > Variables), Protected + Masked, environment scope "signing/main":
#   CI_PUSH_TOKEN              Project access token, role Maintainer, scopes api + write_repository (bump-version only)
#   SIG_PFX_B64, SIG_PFX_PASS  Optional: Windows code-signing .pfx (base64) and password; without them the Windows
#                              exe and installers are published unsigned, with a warning

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    # Avoid a duplicate branch pipeline while a merge request is open for the branch
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS && $CI_PIPELINE_SOURCE == "push"
      when: never
    - if: $CI_COMMIT_BRANCH

variables:
  BUMP_VERSION:
    value: "none"
    options: ["none", "patch", "minor", "major", "prepatch", "preminor", "premajor", "prerelease"]
    description: "Version bump type. Leave as 'none' to just build and release the current version."
  BUMP_PREID:
    value: "rc"
    description: "Prerelease identifier for the pre* bump types (e.g. alpha, beta, rc)."

default:
  tags: [windows]

stages:
  - check
  - build
  - release

.signing-environment: &signing-environment
  name: signing/$CI_COMMIT_BRANCH
  action: prepare

.ci-rules: &ci-rules
  - if: $BUMP_VERSION != "none"
    when: never
  - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

.release-rules: &release-rules
  - if: $BUMP_VERSION != "none"
    when: never
  - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

.rid-matrix: &rid-matrix
  - RID: [win-x64, win-arm64, linux-x64, linux-arm64]

# ── CI ──────────────────────────────────────────────────────────────────────────────────────────────

test:
  stage: check
  rules: *ci-rules
  script:
    - dotnet test MediaRiffle.slnx --logger "trx;LogFileName=results.trx" --results-directory TestResults
  artifacts:
    when: always
    paths:
      - TestResults/
    expire_in: 7 days

ci-package:
  stage: build
  rules: *ci-rules
  parallel:
    matrix: *rid-matrix
  script:
    - $version = ([regex]::Match((Get-Content src/MediaRiffle.Server/MediaRiffle.Server.csproj -Raw), '<Version>([^<]+)')).Groups[1].Value
    - ./build/Package.ps1 -Rid $env:RID -OutDir ci-files -Label "v$version-ci$env:CI_PIPELINE_IID-$env:CI_COMMIT_SHORT_SHA"
  artifacts:
    name: ci-$RID
    paths:
      - ci-files/
    expire_in: 7 days

# ── Release ─────────────────────────────────────────────────────────────────────────────────────────

release-check:
  stage: check
  rules: *release-rules
  script:
    - ./.gitlab/scripts/release-check.ps1 -Project src/MediaRiffle.Server/MediaRiffle.Server.csproj -Element Version
  artifacts:
    reports:
      dotenv: release.env

release-build:
  stage: build
  rules: *release-rules
  needs: [release-check]
  environment: *signing-environment
  parallel:
    matrix: *rid-matrix
  script:
    - if ($env:RELEASE_PUBLISHED -eq 'true') { Write-Host "Release $env:RELEASE_TAG already exists; skipping."; exit 0 }
    - ./build/Package.ps1 -Rid $env:RID -OutDir release-files -Version $env:RELEASE_VERSION
  artifacts:
    paths:
      - release-files/
    expire_in: 7 days

release-publish:
  stage: release
  rules: *release-rules
  needs: [release-check, release-build]
  resource_group: release
  script:
    - ./.gitlab/scripts/publish-release.ps1 -PackageName mediariffle -ReleaseName MediaRiffle

# ── Version bump ────────────────────────────────────────────────────────────────────────────────────

bump-version:
  stage: build
  resource_group: bump-version
  environment: *signing-environment
  rules:
    - if: $CI_PIPELINE_SOURCE == "web" && $BUMP_VERSION != "none"
  variables:
    GIT_DEPTH: 0   # full history: the changelog lists merge requests since the last tag
  script:
    - ./.gitlab/scripts/bump.ps1 -BumpType $env:BUMP_VERSION -PreId $env:BUMP_PREID
